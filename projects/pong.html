<!DOCTYPE html>
<html lang="en">
  <head>
  	<meta charset="UTF-8">
  	<meta name="viewport" content="width=device-width, initial-scale=1.0">
  	<title>Impongsible</title>
  	<style>
  	  body {
  	  	background-color: black;
  	  }
  	</style>
  </head>
  <body>
  	<canvas id="gameField" width="1300" height="600"></canvas>
		<script>
		  const gameField = document.getElementById("gameField");
		  const ctxt = gameField.getContext("2d");
		  let raf;
		  let hasMoved;
		  let mouseY;
		  let score = 0;
		  let isPaused;
		  let started;
		  // replay
		  // leaderboard (for single player); autofill name after first entry
		  // On unpause, make player "catch" the paddles by moving their
		  // mouse back to where paddles are. This prevents unnatural
		  // jumps by the paddles.

		  const ball = {
		  	initX: 100,
		  	initY: 100,
		  	initVx: 15,
		  	initVy: 7,
		  	x: this.initX,
		  	y: this.initY,
		  	vx: this.initVx,
		  	vy: this.initVy,
		  	radius: 10,
		  	draw() {
				  ctxt.beginPath();
				  ctxt.arc(this.x, this.y, this.radius, 0, Math.PI*2, true);
				  ctxt.closePath();
				  ctxt.fillStyle = "white";
				  ctxt.fill();
		  	}
		  };

		  const lpad = {
		  	initX: 0,
		  	initY: 100,
		  	x: this.initX,
		  	y: this.initY,
		  	width: 25,
		  	height: 100,
		  	draw() {
				  ctxt.fillStyle = "red";
				  ctxt.fillRect(this.x, this.y, this.width, this.height);
		  	}
		  };

		  const rpad = {
		  	initX: 1275,
		  	initY: 100,
		  	x: this.initX,
		  	y: this.initY,
		  	width: 25,
		  	height: 100,
		  	draw() {
				  ctxt.fillStyle = "red";
				  ctxt.fillRect(this.x, this.y, this.width, this.height);
		  	}
		  }

		  const startButton = {
		  	x: 595,
		  	y: 300,
		  	width: 150,
		  	height: 75,
		  	draw() {
		  		ctxt.strokeStyle = "white";
		  		ctxt.strokeRect(this.x, this.y, this.width, this.height);
		  		ctxt.font = "30px serif";
		  		ctxt.fillStyle = "white";
		  		ctxt.fillText("Play", this.x + 50, this.y + 45);
		  	}
		  }

		  const continueButton = {
		  	x: 675,
		  	y: 300,
		  	width: 150,
		  	height: 75,
		  	draw() {
		  		ctxt.strokeStyle = "white";
		  		ctxt.strokeRect(this.x, this.y, this.width, this.height);
		  		ctxt.font = "30px serif";
		  		ctxt.fillStyle = "white";
		  		ctxt.fillText("Continue", this.x + 25, this.y + 45);
		  	}
		  }

		  const restartButton = {
		  	x: 500,
		  	y: 300,
		  	width: 150,
		  	height: 75,
		  	draw() {
		  		ctxt.strokeStyle = "white";
		  		ctxt.strokeRect(this.x, this.y, this.width, this.height);
		  		ctxt.font = "30px serif";
		  		ctxt.fillStyle = "white";
		  		ctxt.fillText("Restart", this.x + 35, this.y + 45);
		  	}
		  }

		  const endRestartButton = {
		  	x: 550,
		  	y: 300,
		  	width: 150,
		  	height: 75,
		  	draw() {
		  		ctxt.strokeStyle = "white";
		  		ctxt.strokeRect(this.x, this.y, this.width, this.height);
		  		ctxt.font = "30px serif";
		  		ctxt.fillStyle = "white";
		  		ctxt.fillText("Restart", this.x + 35, this.y + 45);
		  	}
		  }

		  function endRestart(e) {
		  	mouseX = e.offsetX;
		  	mouseY = e.offsetY;
		  	if (mouseX >= endRestartButton.x &&
		  			mouseX <= endRestartButton.x + endRestartButton.width &&
		  			mouseY >= endRestartButton.y &&
		  			mouseY <= endRestartButton.y + endRestartButton.height) {
		  		isPaused = false;
		  		started = true;
		  		score = 0;
		  		ball.x = ball.initX;
		  		ball.y = ball.initY;
		  		ball.vx = ball.initVx;
		  		ball.vy = ball.initVy;
		  		lpad.x = lpad.initX;
		  		lpad.y = lpad.initY;
		  		rpad.x = rpad.initX;
		  		rpad.y = rpad.initY;
		  		e.currentTarget.removeEventListener("click", endRestart);
		  		draw();
		  	}
		  }

		  function end(whoWins) {
		  	started = false;
		  	ctxt.font = "48px serif";
		  	ctxt.fillStyle = "white";
		  	if (whoWins == 0) {
		  		ctxt.fillText("Player 1 wins!", 500, 250);
		  	} else {
		  		ctxt.fillText("Player 2 wins!", 500, 250);
		  	}
		  	gameField.addEventListener("click", endRestart);
		  	endRestartButton.draw();
		  }

		  function restart(e) {
		  	mouseX = e.offsetX;
		  	mouseY = e.offsetY;
		  	if (mouseX >= restartButton.x &&
		  			mouseX <= restartButton.x + restartButton.width &&
		  			mouseY >= restartButton.y &&
		  			mouseY <= restartButton.y + restartButton.height) {
		  		isPaused = false;
		  		started = true;
		  		score = 0;
		  		ball.x = ball.initX;
		  		ball.y = ball.initY;
		  		ball.vx = ball.initVx;
		  		ball.vy = ball.initVy;
		  		lpad.x = lpad.initX;
		  		lpad.y = lpad.initY;
		  		rpad.x = rpad.initX;
		  		rpad.y = rpad.initY;
		  		e.currentTarget.removeEventListener("click", restart);
		  		draw();
		  	}
		  }

		  function unpause(e) {
		  	mouseX = e.offsetX;
		  	mouseY = e.offsetY;
		  	if (mouseX >= continueButton.x &&
		  			mouseX <= continueButton.x + continueButton.width &&
		  			mouseY >= continueButton.y &&
		  			mouseY <= continueButton.y + continueButton.height) {
		  		isPaused = false;
		  		e.currentTarget.removeEventListener("click", unpause);
		  		draw();
		  	}
		  }

		  function pause() {
		  	// Draw pause message box (semi-transparent box)
		  	ctxt.font = "48px serif";
		  	ctxt.fillStyle = "white";
		  	ctxt.fillText("Paused", 600, 250);

		  	// Draw "Continue" button
		  	gameField.addEventListener("click", unpause);
		  	continueButton.draw();

		  	// Draw "Restart" button
		  	gameField.addEventListener("click", restart);
		  	restartButton.draw();
		  }

		  // Displays game
		  function draw() {
		  	ctxt.clearRect(0, 0, gameField.width, gameField.height);

		  	// Draw score
		  	ctxt.font = "30px serif";
		  	ctxt.fillStyle = "white";
		  	ctxt.fillText("Score: " + score, 1150, 60);

		  	const hitLeftPad = (ball.y >= lpad.y) && (ball.y <= lpad.y + lpad.height) && (ball.x - ball.radius <= lpad.x + lpad.width);
		  	const hitRightPad = (ball.y >= rpad.y) && (ball.y <= rpad.y + rpad.height) && (ball.x + ball.radius >= rpad.x);
		  	if (hitLeftPad || hitRightPad) {
		  		ball.vx = -ball.vx;
		  		score += 1;
		  	}

		  	// TODO: Fix ball clipping through paddle when paddle moves and ball is moving vertically.
		  	const hitTopPad = ((ball.x - ball.radius <= lpad.x + lpad.width) && (ball.y + ball.radius >= lpad.y) && ball.y <= lpad.y) || ((ball.x + ball.radius >= rpad.x) && (ball.y + ball.radius >= rpad.y) && ball.y <= rpad.y);
		  	const hitBotPad = ((ball.x - ball.radius <= lpad.x + lpad.width) && (ball.y - ball.radius <= lpad.y + lpad.height) && (ball.y >= lpad.y + lpad.height)) || ((ball.x + ball.radius >= rpad.x) && (ball.y - ball.radius <= rpad.y + rpad.height) && ball.y >= rpad.y + rpad.height);
		  	if (hitTopPad || hitBotPad) {
		  		ball.vy = -ball.vy;
		  	}

		  	if (ball.y + ball.vy > gameField.height - ball.radius ||
		  		ball.y + ball.vy < ball.radius) {
		  		ball.vy = -ball.vy;
		  	}

		  	if (ball.x - ball.vx > gameField.width - ball.radius) {
		  		end(0); // Player 1 wins
		  	}

		  	if (ball.x - ball.vx < ball.radius) {
		  		end(1); // Player 2 wins
		  	}

		  	if (hasMoved) {
		  		lpad.y = mouseY;
		  		rpad.y = mouseY;
			  	hasMoved = false;
		  	}

			  ball.draw();
			  ball.x += ball.vx;
			  ball.y += ball.vy;

			  lpad.draw();
			  rpad.draw();

		  	if (!isPaused && started) {
		  		raf = window.requestAnimationFrame(draw);
		  	} 
		  	if (isPaused) {
		  		pause();
		  	}
		  }

		  function start(e) {
		  	mouseX = e.offsetX;
		  	mouseY = e.offsetY;
		  	if (mouseX >= startButton.x &&
		  			mouseX <= startButton.x + startButton.width &&
		  			mouseY >= startButton.y &&
		  			mouseY <= startButton.y + startButton.height) {
					gameField.addEventListener("mousemove", (e) => { 
						mouseY = e.offsetY;
						if (mouseY <= gameField.height - lpad.height) {
							hasMoved = true;
						}
					});
					started = true;
		  		ball.x = ball.initX;
		  		ball.y = ball.initY;
		  		ball.vx = ball.initVx;
		  		ball.vy = ball.initVy;
		  		lpad.x = lpad.initX;
		  		lpad.y = lpad.initY;
		  		rpad.x = rpad.initX;
		  		rpad.y = rpad.initY;
					e.currentTarget.removeEventListener("click", start);
		  		draw();
		  	}
		  }

		  // Controls start screen
		  function init() {
		  	gameField.addEventListener("click", start);

		  	document.addEventListener("keydown", (e) => {
		  		if (e.key == "Escape" && started) {
		  			isPaused = true;
		  		}
		  	});

		  	ctxt.font = "48px serif";
		  	ctxt.fillStyle = "white";
		  	ctxt.fillText("Impongsible", 550, 250);
		  	startButton.draw();
		  }

		  init();
		</script>
  </body>
</html>
