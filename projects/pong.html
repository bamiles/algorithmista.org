<!DOCTYPE html>
<html lang="en">
  <head>
  	<meta charset="UTF-8">
  	<meta name="viewport" content="width=device-width, initial-scale=1.0">
  	<title>Impongsible</title>
  	<style>
  	  body {
  	  	background-color: black;
  	  }
  	</style>
  </head>
  <body>
  	<canvas id="gameField" width="1300" height="600"></canvas>
		<script>
		  const gameField = document.getElementById("gameField");
		  const ctxt = gameField.getContext("2d");
		  let score = 0;
		  let secLeft = 3;
		  let balls;
		  let paddles;
		  let raf;
		  let isPaused;
		  let started;
		  let lastTime;

		  class Ball {
		  	static radius = 10;

		  	#x;
		  	#y;
		  	#vx;
		  	#vy;

		  	constructor(initX, initY, initVx, initVy) {
			  	this.#x = initX;
			  	this.#y = initY;
			  	this.#vx = initVx;
			  	this.#vy = initVy;
		  	}

		  	getX() {
		  		return this.#x;
		  	}

		  	getY() {
		  		return this.#y;
		  	}

		  	getVx() {
		  		return this.#vx;
		  	}

		  	getVy() {
		  		return this.#vy;
		  	}

		  	setVx(vx) {
		  		this.#vx = vx;
		  	}

		  	setVy(vy) {
		  		this.#vy = vy;
		  	}

		  	draw() {
				  ctxt.beginPath();
				  ctxt.arc(this.#x, this.#y, Ball.radius, 0, Math.PI*2, true);
				  ctxt.closePath();
				  ctxt.fillStyle = "white";
				  ctxt.fill();
		  	}

		  	move() {
		  		this.#x += this.#vx;
		  		this.#y += this.#vy;
		  	}
		  }

		  class Button {
		  	#x;
		  	#y;
		  	#width;
		  	#height;

		  	constructor(x, y, width, height) {
		  		this.#x = x;
		  		this.#y = y;
		  		this.#width = width;
		  		this.#height = height;
		  	}

		  	getX() {
		  		return this.#x;
		  	}

		  	getY() {
		  		return this.#y;
		  	}

		  	getWidth() {
		  		return this.#width;
		  	}

		  	getHeight() {
		  		return this.#height;
		  	}

		  	draw(text, font) {
		  		ctxt.fillStyle = "black";
		  		ctxt.fillRect(this.#x, this.#y, this.#width, this.#height);
		  		ctxt.strokeStyle = "white";
		  		ctxt.strokeRect(this.#x, this.#y, this.#width, this.#height);
		  		ctxt.font = font;
		  		ctxt.fillStyle = "white";
		  		ctxt.textAlign = "center";
		  		ctxt.textBaseline = "middle";
		  		ctxt.fillText(text, this.#x + this.#width/2, this.#y + this.#height/2);
		  	}
		  }

		  class Paddle {
		  	static #vy = 9;

		  	#x;
		  	#y;
		  	#width;
		  	#height;
		  	#up;
		  	#down;

		  	constructor(x, y, width, height) {
		  		this.#x = x;
		  		this.#y = y;
		  		this.#width = width;
		  		this.#height = height;
		  	}

		  	getX() {
		  		return this.#x;
		  	}

		  	getY() {
		  		return this.#y;
		  	}

		  	getWidth() {
		  		return this.#width;
		  	}

		  	getHeight() {
		  		return this.#height;
		  	}

		  	registerKeys(upKey, downKey) {
					document.addEventListener("keydown", (e) => {
						if (e.key == upKey && started) {
							this.#up = true;
						}
						if (e.key == downKey && started) {
							this.#down = true;
						}
					});

					document.addEventListener("keyup", (e) => {
						if (e.key == upKey && started) {
							this.#up = false;
						}
						if (e.key == downKey && started) {
							this.#down = false;
						}
					});
		  	}

		  	draw() {
				  ctxt.fillStyle = "red";
				  ctxt.fillRect(this.#x, this.#y, this.#width, this.#height);
		  	}

		  	move() {
		  		if (this.#up && this.#y >= Paddle.#vy) {
		  			this.#y -= Paddle.#vy;
		  		}
		  		if (this.#down && this.#y + this.#height <= gameField.height - Paddle.#vy) {
		  			this.#y += Paddle.#vy;
		  		}
		  	}
		  }

		  function endRestart(e) {
		  	mouseX = e.offsetX;
		  	mouseY = e.offsetY;
		  	if (mouseX >= endRestartButton.getX() &&
		  			mouseX <= endRestartButton.getX() + endRestartButton.getWidth() &&
		  			mouseY >= endRestartButton.getY() &&
		  			mouseY <= endRestartButton.getY() + endRestartButton.getHeight()) {
		  		isPaused = false;
		  		lastTime = null;
		  		score = 0;
		  		secLeft = 3;
		  		balls = [new Ball(100, 100, 10, 5)];
					leftPad = new Paddle(0, 100, 25, 150);
		  		rightPad = new Paddle(1275, 100, 25, 150);
		  		leftPad.registerKeys("q", "a");
		  		rightPad.registerKeys("p", "l");
		  		paddles = [leftPad, rightPad];
		  		e.currentTarget.removeEventListener("click", endRestart);
		  		draw();
		  	}
		  }

		  function end(whoWins) {
		  	started = false;
		  	ctxt.font = "48px serif";
		  	ctxt.fillStyle = "white";
		  	ctxt.textAlign = "center";
		  	if (whoWins == 0) {
		  		ctxt.fillText("Player 1 wins!", gameField.width/2, gameField.height/2-gameField.height/10);
		  	} else {
		  		ctxt.fillText("Player 2 wins!", gameField.width/2, gameField.height/2-gameField.height/10);
		  	}
		  	gameField.addEventListener("click", endRestart);
		  	endRestartButton = new Button(gameField.width/2-gameField.width/16, gameField.height/2, gameField.width/8, gameField.height/8);
		  	endRestartButton.draw("Restart", "30px serif");
		  }

		  function restart(e) {
		  	mouseX = e.offsetX;
		  	mouseY = e.offsetY;
		  	if (mouseX >= restartButton.getX() &&
		  			mouseX <= restartButton.getX() + restartButton.getWidth() &&
		  			mouseY >= restartButton.getY() &&
		  			mouseY <= restartButton.getY() + restartButton.getHeight()) {
		  		isPaused = false;
		  		started = false;
		  		lastTime = null;
		  		score = 0;
		  		secLeft = 3;
		  		balls = [new Ball(100, 100, 10, 5)];
					leftPad = new Paddle(0, 100, 25, 150);
		  		rightPad = new Paddle(1275, 100, 25, 150);
		  		leftPad.registerKeys("q", "a");
		  		rightPad.registerKeys("p", "l");
		  		paddles = [leftPad, rightPad];
		  		e.currentTarget.removeEventListener("click", restart);
		  		e.currentTarget.removeEventListener("click", unpause);
		  		draw();
		  	}
		  }

		  function unpause(e) {
		  	mouseX = e.offsetX;
		  	mouseY = e.offsetY;
		  	if (mouseX >= continueButton.getX() &&
		  			mouseX <= continueButton.getX() + continueButton.getWidth() &&
		  			mouseY >= continueButton.getY() &&
		  			mouseY <= continueButton.getY() + continueButton.getHeight()) {
		  		isPaused = false;
		  		e.currentTarget.removeEventListener("click", unpause);
		  		e.currentTarget.removeEventListener("click", restart);
		  		draw();
		  	}
		  }

		  function pause() {
		  	// Draw pause message box (semi-transparent box)
		  	ctxt.font = "48px serif";
		  	ctxt.fillStyle = "white";
		  	ctxt.textAlign = "center";
		  	ctxt.fillText("Paused", gameField.width/2, gameField.height/2-gameField.height/10);

		  	// Draw "Continue" button
		  	gameField.addEventListener("click", unpause);
		  	continueButton = new Button(gameField.width/2 - gameField.width/80 - gameField.width/8, gameField.height/2, gameField.width/8, gameField.height/8);
		  	continueButton.draw("Continue", "30px serif");

		  	// Draw "Restart" button
		  	gameField.addEventListener("click", restart);
		  	restartButton = new Button(gameField.width/2 + gameField.width/80, gameField.height/2, gameField.width/8, gameField.height/8);
		  	restartButton.draw("Restart", "30px serif");
		  }

		  function countdown(timestamp) {
		  	if (!lastTime) { lastTime = timestamp; }

				ctxt.font = "60px serif";
				ctxt.fillStyle = "white";
				ctxt.clearRect(gameField.width/2-gameField.width/20, gameField.height/2-gameField.height/10, 100, 100);
				ctxt.fillText(secLeft, gameField.width/2, gameField.height/2);

		  	const elapsed = timestamp - lastTime;

		  	if (elapsed >= 1000) {
		  		secLeft -= 1;
		  		lastTime = timestamp;
		  	}

				if (secLeft == 0) {
					started = true;
					draw();
				} else {
					raf = requestAnimationFrame(countdown);
				}
		  }

		  function handleCollision(ball) {
		  	const ballX = ball.getX();
		  	const ballY = ball.getY();
		  	var ballVx = ball.getVx();
		  	var ballVy = ball.getVy();

		  	const leftPadX = paddles[0].getX();
		  	const leftPadY = paddles[0].getY();
		  	const rightPadX = paddles[1].getX();
		  	const rightPadY = paddles[1].getY();
		  	const padWidth = paddles[0].getWidth();
		  	const padHeight = paddles[0].getHeight();

		  	const hitLeftPad = ballY + ballVy >= leftPadY &&
		  										ballY + ballVy <= leftPadY + padHeight &&
		  										ballX - Ball.radius + ballVx <= leftPadX + padWidth;
		  	const hitRightPad = ballY + ballVy >= rightPadY &&
		  										ballY + ballVy <= rightPadY + padHeight &&
		  										ballX + Ball.radius + ballVx >= rightPadX;
		  	const hitTopPad = (ballX - Ball.radius <= leftPadX + padWidth && ballY + Ball.radius >= leftPadY && ballY <= leftPadY) ||
		  										(ballX + Ball.radius >= rightPadX && ballY + Ball.radius >= rightPadY && ballY <= rightPadY);
		  	const hitBotPad = (ballX - Ball.radius <= leftPadX + padWidth && ballY - Ball.radius <= leftPadY + padHeight && ballY >= leftPadY + padHeight) ||
		  										(ballX + Ball.radius >= rightPadX && ballY - Ball.radius <= rightPadY + padHeight && ballY >= rightPadY + padHeight);

			  if (hitLeftPad || hitRightPad) {
			  	ball.setVx(-ballVx);
			  	ball.setVy(ballVy);
			  	ballVx = ball.getVx();
			  	ballVy = ball.getVy();
			  	score += 1;

				  if (score % 10 == 0 && score >= 10 && score <= 50) {
				  	// Increase speed
				  	ball.setVx(ballVx * 1.05);
				  	ball.setVy(ballVy * 1.05);
				  	ballVx = ball.getVx();
				  	ballVy = ball.getVy();
				  }
			  }

			  // TODO: Fix ball clipping through paddle when paddle moves and ball is moving vertically.
			  if (hitTopPad || hitBotPad) {
			  	ball.setVy(-ballVy);
				  ballVy = ball.getVy();
			  }

			  if (ballY + ballVy > gameField.height - Ball.radius || ballY + ballVy < Ball.radius) {
			  	ball.setVy(-ballVy);
			  }
		  }

		  // Displays game
		  function draw() {
		  	ctxt.clearRect(0, 0, gameField.width, gameField.height);

		  	// Draw top border
		  	ctxt.beginPath();
		  	ctxt.moveTo(0, 0);
		  	ctxt.lineTo(gameField.width, 0);
		  	ctxt.stroke();
		  	// Draw bottom border
		  	ctxt.beginPath();
		  	ctxt.moveTo(0, gameField.height);
		  	ctxt.lineTo(gameField.width, gameField.height);
		  	ctxt.stroke();
		  	// Draw "net"
		  	ctxt.beginPath();
		  	for (i = 0; i < 100; i++) {
		  		ctxt.moveTo(gameField.width/2, 6*i + 1.5);
		  		ctxt.lineTo(gameField.width/2, 6*i + 4.5);
		  	}
		  	ctxt.stroke();

		  	// Draw score
		  	ctxt.font = "30px serif";
		  	ctxt.fillStyle = "white";
		  	ctxt.fillText("Score: " + score, gameField.width-gameField.width/10, gameField.height/10);

		  	for (const ball of balls) {
		  		handleCollision(ball);
		  		ball.draw(ctxt);
		  		ball.move();
				  if (ball.getX() - Ball.radius > gameField.width) {
				  	end(0); // Player 1 wins
				  }
				  if (ball.getX() < -Ball.radius) {
				  	end(1); // Player 2 wins
				  }
		  	}

		  	for (const paddle of paddles) {
		  		paddle.draw(ctxt);
		  		paddle.move();
		  	}

			  // Countdown timer
		  	if (secLeft > 0) {
		  		countdown();
		  	}

		  	if (!isPaused && started) {
		  		raf = requestAnimationFrame(draw);
		  	}

		  	if (isPaused) {
		  		pause();
		  	}
		  }

		  function start(e) {
		  	mouseX = e.offsetX;
		  	mouseY = e.offsetY;
		  	if (mouseX >= startButton.getX() &&
		  			mouseX <= startButton.getX() + startButton.getWidth() &&
		  			mouseY >= startButton.getY() &&
		  			mouseY <= startButton.getY() + startButton.getHeight()) {
		  		balls = [new Ball(100, 100, 10, 5)];
		  		leftPad = new Paddle(0, 100, 25, 150);
		  		rightPad = new Paddle(1275, 100, 25, 150);
		  		leftPad.registerKeys("q", "a");
		  		rightPad.registerKeys("p", "l");
		  		paddles = [leftPad, rightPad];
					e.currentTarget.removeEventListener("click", start);
					draw();
		  	}
		  }

		  // Controls start screen
		  function init() {
		  	gameField.addEventListener("click", start);
		  	startButton = new Button(gameField.width/2-gameField.width/20, gameField.height/2, gameField.width/10, gameField.height/8);
		  	startButton.draw("Play", "30px serif");

		  	document.addEventListener("keydown", (e) => {
		  		if (e.key == "Escape" && started) {
		  			isPaused = true;
		  		}
		  	});

		  	ctxt.font = "48px serif";
		  	ctxt.fillStyle = "white";
		  	ctxt.textAlign = "center";
		  	ctxt.fillText("Impongsible", gameField.width/2, gameField.height/2-gameField.height/10);
		  }

		  init();
		</script>
  </body>
</html>
