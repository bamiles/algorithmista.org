<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Impongsible</title>
	<style>
	body {
		background-color: black;
	}
	</style>
</head>
<body>
	<canvas id="gameField" width="1300" height="600"></canvas>
	<script type="module">
		import { Ball, Button, Paddle } from "./objects.mjs";
		import { Game } from "./game.mjs";

		const gameField = document.getElementById("gameField");
		const ctxt = gameField.getContext("2d");

		// Buttons
		let playSoloBtn;
		let surrenderBtn;
		let continueBtn;
		let endRestartBtn;

		// Game objects
		let currState;
		let game;

		// Mouse coordinates
		let mouseX;
		let mouseY;

		// Rendering function
		function draw() {
			ctxt.clearRect(0, 0, gameField.width, gameField.height);
			currState = game.getGameState();

			// Draw top border
			ctxt.beginPath();
			ctxt.moveTo(0, 0);
			ctxt.lineTo(gameField.width, 0);
			ctxt.stroke();

			// Draw bottom border
			ctxt.beginPath();
			ctxt.moveTo(0, gameField.height);
			ctxt.lineTo(gameField.width, gameField.height);
			ctxt.stroke();

			// Draw "net"
			ctxt.beginPath();
			for (let i = 0; i < 100; i++) {
			ctxt.moveTo(gameField.width/2, gameField.height/100*i + 1.5);
			ctxt.lineTo(gameField.width/2, gameField.height/100*i + 4.5);
			}
			ctxt.stroke();

			// Draw score
			ctxt.font = "30px serif";
			ctxt.fillStyle = "white";
			ctxt.fillText("Score: " + currState["score"], gameField.width-gameField.width/10, gameField.height/10);

			// Draw balls
			for (const ball of currState["balls"]) {
				ball.draw(ctxt);
			}

			// Draw paddles
			for (const paddle of currState["paddles"]) {
				paddle.draw(ctxt);
			}

			if (game.getCountdown() > 0) {
				renderCountdown();
				requestAnimationFrame(draw);
			}

			if (!game.isPaused() && game.hasStarted()) {
				requestAnimationFrame(draw);
			}

			if (game.isPaused()) {
				renderPause();
			}

			if (game.hasEnded()) {
				renderEnd();
			}
		}

		function renderCountdown(state=undefined) {
			const count = game.getCountdown();
			ctxt.font = "60px serif";
			ctxt.strokeStyle = "white";
			ctxt.fillStyle = "white";
			ctxt.clearRect(gameField.width/2-gameField.width/26, gameField.height/2-gameField.height/14, gameField.width/13, gameField.height/7);
			ctxt.strokeRect(gameField.width/2-gameField.width/26, gameField.height/2-gameField.height/14, gameField.width/13, gameField.height/7);
			ctxt.fillText(count, gameField.width/2, gameField.height/2);
		}		

		function renderPause() {
			// Draw pause message box (semi-transparent box)
			ctxt.font = "48px serif";
			ctxt.fillStyle = "white";
			ctxt.textAlign = "center";
			ctxt.fillText("Paused", gameField.width/2, gameField.height/2-gameField.height/10);

			// Draw "Continue" button
			gameField.addEventListener("click", surrender);
			surrenderBtn = new Button(ctxt, gameField.width/2 - gameField.width/80 - gameField.width/8, gameField.height/2, gameField.width/8, gameField.height/8);
			surrenderBtn.draw("Give Up", "30px serif");

			// Draw "Restart" button
			gameField.addEventListener("click", unpause);
			continueBtn = new Button(ctxt, gameField.width/2 + gameField.width/80, gameField.height/2, gameField.width/8, gameField.height/8);
			continueBtn.draw("Continue", "30px serif");
		}

		function renderEnd() {
			ctxt.font = "48px serif";
			ctxt.fillStyle = "white";
			ctxt.textAlign = "center";
			ctxt.fillText(`Final Score: ${game.getScore()}`, gameField.width/2, gameField.height/2-gameField.height/10);

			gameField.addEventListener("click", endRestart);
			endRestartBtn = new Button(ctxt, gameField.width/2-gameField.width/16, gameField.height/2, gameField.width/8, gameField.height/8);
			endRestartBtn.draw("Restart", "30px serif");
		}	

		function unpause(e) {
			mouseX = e.offsetX;
			mouseY = e.offsetY;
			if (continueBtn.isClicked(mouseX, mouseY)) {
				gameField.removeEventListener("click", unpause);
				gameField.removeEventListener("click", surrender);
				game.unpause();
				requestAnimationFrame(draw);
			}
		}

		function surrender(e) {
			mouseX = e.offsetX;
			mouseY = e.offsetY;
			if (surrenderBtn.isClicked(mouseX, mouseY)) {
				gameField.removeEventListener("click", unpause);
				gameField.removeEventListener("click", surrender);
				game.end(0);
				requestAnimationFrame(draw);
			}
		}

		function endRestart(e) {
			mouseX = e.offsetX;
			mouseY = e.offsetY;
			if (endRestartBtn.isClicked(mouseX, mouseY)) {
				gameField.removeEventListener("click", endRestart);

				const ball = new Ball(gameField.width/10, gameField.height/2, 11, 0);
				const leftPad = new Paddle(10, gameField.height/2-75, 25, 150, "", "left");
				const rightPad = new Paddle(gameField.width-35, gameField.height/2-75, 25, 150, "", "right");
				leftPad.registerKeys("q", "a");
				rightPad.registerKeys("p", "l");

				const balls = [ball];
				const paddles = [leftPad, rightPad];
				game = new Game("single", 0, balls, paddles, gameField.width, gameField.height);
				game.start();

				requestAnimationFrame(draw);
			}
		}

		function startSolo(e) {
			mouseX = e.offsetX;
			mouseY = e.offsetY;

			if (playSoloBtn.isClicked(mouseX, mouseY)) {
				gameField.removeEventListener("click", startSolo);

				const ball = new Ball(gameField.width/10, gameField.height/2, 11, 0);
				const leftPad = new Paddle(0, gameField.height/2-75, 25, 150, "", "left");
				const rightPad = new Paddle(gameField.width-25, gameField.height/2-75, 25, 150, "", "right");
				leftPad.registerKeys("q", "a");
				rightPad.registerKeys("p", "l");

				const balls = [ball];
				const paddles = [leftPad, rightPad];
				game = new Game("single", 0, balls, paddles, gameField.width, gameField.height);
				game.start();

				document.addEventListener("keydown", (e) => {
					if (e.key === "Escape" && game.hasStarted()) {
						game.pause();
					}
				});

				requestAnimationFrame(draw);
			}
		}

		// Controls start screen
		function init() {
			playSoloBtn = new Button(ctxt, gameField.width/2-gameField.width/16, gameField.height/2, 
				gameField.width/8, gameField.height/8);
			gameField.addEventListener("click", startSolo);
			playSoloBtn.draw("Play (Solo)", "30px serif");

			ctxt.font = "48px serif";
			ctxt.fillStyle = "white";
			ctxt.textAlign = "center";
			ctxt.fillText("Impongsible", gameField.width/2, gameField.height/2-gameField.height/10);
		}

		init();
	</script>
  </body>
</html>
